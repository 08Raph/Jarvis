[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-jarvis"
version = "0.6.0"          # must equal src/jarvis/version.py (a test enforces it)
description = "PROJECT JARVIS - local desktop assistant with an original model pipeline"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "cryptography>=42", "tzdata>=2024.1; sys_platform == 'win32'"]   # Windows has no IANA time-zone database of its own

[project.optional-dependencies]
train = ["torch>=2.3"]
ui = ["PySide6>=6.7,<7"]
build = ["pyinstaller>=6.6"]
local = ["llama-cpp-python>=0.3"]
voice = ["sounddevice>=0.4.6", "vosk>=0.3.45"]
docs = ["pypdf>=4"]
monitor = ["psutil>=5.9"]
desktop = ["comtypes>=1.4; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[project.gui-scripts]
jarvis-gui = "jarvis.ui.app:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
