# Windows build on GitHub-hosted windows-2022 runners. This repository is PRIVATE, so runs use the account's Actions minutes (Windows runners count at a multiplier) and artifacts count against Actions storage - they are not free. A green run proves only what its steps actually checked; read the run's annotations and logs.
name: build-windows
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      reuse_installer_run_id:
        description: "Diagnostic mode: skip build + Stage 3 steps and reuse the installer artifact of this earlier run (leave empty for a full run)"
        required: false
        default: ""
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Reuse mode precheck - the earlier installer must come from a SUCCESSFUL full build, still be available, and match this commit's app files
        if: inputs.reuse_installer_run_id != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.reuse_installer_run_id }}
          # Files that change what the installer contains (audited against packaging/jarvis.spec, installer.iss, manifest.py and scripts/build_windows.ps1):
          #   src (all app code), packaging (spec, installer, manifest, entry points), pyproject.toml (dependencies/extras), config.sample.toml, LICENSE,
          #   docs/INSTALLER_NOTICE.txt (shown by the installer), and the build/check scripts build_windows.ps1 calls (check_build_env, check_release_assets, release_tools, verify_wheel, check_vc_runtime).
          # Deliberately NOT listed, so a change there does not block reuse: tests/, the other scripts/ (CI test drivers, probes), the .github workflows, CHANGELOG, server/ (not packaged),
          #   THIRD_PARTY_NOTICES.md (regenerated by the build), and docs/*.md (the shipped docs listed in packaging/manifest.py DOCS are informational text, not behaviour).
          # requirements-lock.txt is written by the build and is not tracked in git; listing it is harmless.
          APP_PATHS: "src packaging pyproject.toml requirements-lock.txt build_installer.bat config.sample.toml LICENSE docs/INSTALLER_NOTICE.txt scripts/build_windows.ps1 scripts/check_build_env.py scripts/check_release_assets.py scripts/release_tools.py scripts/verify_wheel.py scripts/check_vc_runtime.py"
        run: |
          $next = "Next step: dispatch build-windows again with reuse_installer_run_id left EMPTY to make a fresh full build."
          function Fail($m) { Write-Host "::error title=reuse mode::$m $next"; exit 1 }
          if ($env:RUN_ID -notmatch '^[0-9]{1,15}$') { Fail "reuse_installer_run_id must be a numeric run id." }
          $run = gh api "repos/${{ github.repository }}/actions/runs/$($env:RUN_ID)" | ConvertFrom-Json
          if ($run.path -ne ".github/workflows/build-windows.yml") { Fail "run $($env:RUN_ID) is not a build-windows run." }
          if ($run.conclusion -ne "success") { Fail "run $($env:RUN_ID) did not succeed (conclusion: $($run.conclusion))." }
          $arts = (gh api "repos/${{ github.repository }}/actions/runs/$($env:RUN_ID)/artifacts" | ConvertFrom-Json).artifacts | Where-Object { $_.name -eq "ProjectJarvis-installer" }
          if (-not $arts) { Fail "run $($env:RUN_ID) has no ProjectJarvis-installer artifact (it may never have been uploaded or was deleted)." }
          if ($arts | Where-Object { $_.expired }) { Fail "the installer artifact of run $($env:RUN_ID) has expired (installers are kept 3 days)." }
          git fetch --no-tags --depth=1 origin $run.head_sha
          if ($LASTEXITCODE -ne 0) { Fail "could not fetch the installer's source commit $($run.head_sha) to compare it." }
          $changed = @(git diff --name-only $run.head_sha HEAD -- $env:APP_PATHS.Split(" "))
          if ($LASTEXITCODE -ne 0) { Fail "could not compare commit $($run.head_sha) with this commit." }
          if ($changed.Count -gt 0) { Fail "app files changed between the installer's commit $($run.head_sha) and this commit, so its compatibility cannot be established: $($changed[0..([Math]::Min(9,$changed.Count-1))] -join ', ')." }
          Write-Host "::notice title=reuse mode::installer from run $($env:RUN_ID) (commit $($run.head_sha)) has no app-file differences from this commit."
      - name: Reuse installer from an earlier run (diagnostic mode only)
        if: inputs.reuse_installer_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ProjectJarvis-installer
          path: dist/installer
          run-id: ${{ inputs.reuse_installer_run_id }}
          github-token: ${{ github.token }}
      - name: Install Inno Setup
        if: inputs.reuse_installer_run_id == ''
        run: choco install innosetup --no-progress -y
      - name: Build (PyInstaller, then Inno Setup; the unit tests run in the next step so a Windows-only test failure cannot hide the packaging result)
        if: inputs.reuse_installer_run_id == ''
        shell: powershell
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          try { & { .\scripts\build_windows.ps1 -SkipTorch -SkipTests } *>&1 | Tee-Object -FilePath ci-logs\build.log } catch { ("TERMINATING ERROR: " + ($_ | Out-String)) | Tee-Object -FilePath ci-logs\build.log -Append; exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: unit
        name: Windows unit tests (full suite; failures are REPORTED, not hidden - this step is non-blocking only while Windows-only failures are triaged)
        if: always() && inputs.reuse_installer_run_id == '' && hashFiles('.venv/Scripts/python.exe') != ''
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $env:PYTHONUTF8 = "1"   # many tests read source files without an encoding; Windows defaults to cp1252 (test-side issue; the app code passes encodings explicitly)
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          .\.venv\Scripts\python.exe -m unittest discover -s tests *> ci-logs\unittest.log
          $code = $LASTEXITCODE
          $t = Get-Content ci-logs\unittest.log -Raw
          $blocks = $t -split "(?m)^={60,}\r?$"
          $sum = New-Object System.Collections.Generic.List[string]
          foreach ($b in $blocks) {
            $lines = ($b -split "\r?\n") | Where-Object { $_.Trim() -ne "" }
            if ($lines.Count -gt 0 -and $lines[0] -match "^(FAIL|ERROR): ") {
              $keep = @($lines | Where-Object { $_ -notmatch "^-{60,}$" -and $_ -notmatch "^Ran \d+ tests" -and $_ -notmatch "^private key written|^public key|ResourceWarning|^sys:1" })
              $last = ($keep | Select-Object -Last 4) -join " // "
              $sum.Add($lines[0].Substring(0, [Math]::Min(110, $lines[0].Length)) + "  =>  " + $last.Substring(0, [Math]::Min(420, $last.Length)))
            }
          }
          $sum.Add("RESULT exit=$code " + (($t -split "\r?\n") | Where-Object { $_ -match "^Ran \d+ tests|^(OK|FAILED)" }) -join " ; ")
          $sum | Out-File ci-logs\unittest_failures.txt -Encoding utf8
          $kinds = @("notice","warning","error"); $k = 0; $n = 0; $chunk = ""
          foreach ($l in $sum) {
            if (($chunk.Length + $l.Length) -gt 3000) { Write-Host "::$($kinds[[Math]::Min($k,2)]) title=windows unit test failures part $($n+1)::$chunk"; $chunk = ""; $n++; if ($n % 9 -eq 0) { $k++ } }
            $chunk += $l + "%0A"
          }
          Write-Host "::$($kinds[[Math]::Min($k,2)]) title=windows unit test failures part $($n+1)::$chunk"
          if ($code -ne 0) { exit $code }
      - name: Silent install / launch / uninstall check on the runner
        if: inputs.reuse_installer_run_id == ''
        shell: powershell
        run: |
          $i = (Get-ChildItem dist\installer -Filter "ProjectJarvis-Setup-*.exe" | Select-Object -First 1).FullName
          $global:LASTEXITCODE = 0
          & { .\scripts\clean_install_test.ps1 -Installer $i } *>&1 | Tee-Object -FilePath ci-logs\clean_install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real GUI launch, real setup wizard engine (real model download), real inference, firewall-blocked offline inference
        if: inputs.reuse_installer_run_id == ''
        timeout-minutes: 45
        shell: powershell
        run: |
          $i = (Get-ChildItem dist\installer -Filter "ProjectJarvis-Setup-*.exe" | Select-Object -First 1).FullName
          $global:LASTEXITCODE = 0
          & { .\scripts\ci_real_model_test.ps1 -Installer $i -LogDir ci-logs } *>&1 | Tee-Object -FilePath ci-logs\real_model_step.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Stage 4A: click-through test of the installed GUI wizard (UI Automation + real mouse clicks + real key events)"
        id: gui
        timeout-minutes: 45
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ci-logs\gui | Out-Null
          $i = (Get-ChildItem dist\installer -Filter "ProjectJarvis-Setup-*.exe" | Select-Object -First 1).FullName
          $global:LASTEXITCODE = 0
          & { .\scripts\ci_gui_wizard_test.ps1 -Installer $i -LogDir ci-logs\gui } *>&1 | Tee-Object -FilePath ci-logs\gui_step.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Stage 4B: multi-token performance measurement on the installed app (model installed by the GUI step; no second download)"
        id: perf
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ci-logs\perf | Out-Null
          $exe = "$env:LOCALAPPDATA\Programs\ProjectJarvis\jarvis.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error title=perf::installed jarvis.exe not found"; exit 1 }
          $global:LASTEXITCODE = 0
          & { & $exe perf --out ci-logs\perf --runs 3 --warmup 1 --max-tokens 128 } *>&1 | Tee-Object -FilePath ci-logs\perf\perf_step.log
          exit $LASTEXITCODE
      - name: Cleanup (firewall rules, uninstall keeping user data)
        if: always()
        shell: powershell
        run: |
          foreach ($r in "JarvisGuiBlock-jarvis-gui.exe","JarvisGuiBlock-jarvis.exe") { netsh advfirewall firewall delete rule name="$r" | Out-Null }
          Get-Process jarvis-gui,jarvis -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = "$env:LOCALAPPDATA\Programs\ProjectJarvis\unins000.exe"
          if (Test-Path $u) { $p = Start-Process $u -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru; $null = $p.Handle; $p.WaitForExit(); Write-Host "uninstall exit $($p.ExitCode)" }
          exit 0
      - name: Collect install-check results (runs even if an earlier step failed)
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          foreach ($f in "$env:TEMP\jarvis-clean-install-results.json","$env:TEMP\jarvis-install.log","$env:TEMP\jarvis-gui-selftest.txt") { if (Test-Path $f) { Copy-Item $f ci-logs\ } }
      - name: Report real-run results as annotations (always; the artifacts cannot be downloaded from the monitoring session)
        if: always()
        shell: powershell
        run: |
          $enc = { param($t) ($t -replace "`r?`n", "%0A") }
          foreach ($f in "ci-logs\ci-real-model-summary.txt","ci-logs\setup_state.json","ci-logs\selftest_online.json","ci-logs\setup_auto.err.txt","ci-logs\screenshot_error.txt") {
            if (Test-Path $f) { $t = (Get-Content $f -Raw); if ($t.Length -gt 6000) { $t = $t.Substring(0, 6000) + " ...[truncated]" }; Write-Host "::notice title=$f::$(& $enc $t)" }
          }
          foreach ($f in "ci-logs\gui\gui-summary.txt","ci-logs\perf\perf_summary.txt") {
            if (Test-Path $f) { $t = (Get-Content $f -Raw); if ($t.Length -gt 14000) { $t = $t.Substring(0, 14000) + " ...[truncated]" }; Write-Host "::notice title=$f::$(& $enc $t)" }
          }
          $shots = @(Get-ChildItem ci-logs\gui -Filter "*.png" -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length) bytes sha256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" })
          if ($shots.Count) { Write-Host "::notice title=gui screenshots ($($shots.Count))::$($shots -join '%0A')" }
          foreach ($f in (Get-ChildItem ci-logs\gui -Filter "tree-*.txt" -ErrorAction SilentlyContinue | Select-Object -First 6)) { $t = (Get-Content $f.FullName -Raw); if ($t.Length -gt 3500) { $t = $t.Substring(0, 3500) + " ...[truncated]" }; Write-Host "::notice title=$($f.Name)::$(& $enc $t)" }
          if (Test-Path ci-logs\gui\transcript.txt) { $t = (Get-Content ci-logs\gui\transcript.txt -Tail 45) -join "%0A"; if ($t.Length -gt 5000) { $t = $t.Substring($t.Length-5000) }; Write-Host "::notice title=gui transcript tail::$t" }
          if (Test-Path ci-logs\gui_first_launch.png) { $i = Get-Item ci-logs\gui_first_launch.png; Write-Host "::notice title=gui screenshot::gui_first_launch.png $($i.Length) bytes sha256=$((Get-FileHash $i.FullName -Algorithm SHA256).Hash)" }
          foreach ($f in (Get-ChildItem dist\installer -Filter "*.exe" -ErrorAction SilentlyContinue)) { Write-Host "::notice title=installer::$($f.Name) $($f.Length) bytes sha256=$((Get-FileHash $f.FullName -Algorithm SHA256).Hash)" }
      - name: Surface install log tail
        if: failure()
        shell: powershell
        run: |
          foreach ($f in "$env:TEMP\jarvis-install.log","ci-logs\install.log") { if (Test-Path $f) { $t = (Get-Content $f -Tail 40) -join "%0A"; Write-Host "::warning title=tail of $f::$t" } }
      - name: Surface failure details as annotations (the log download is not reachable from the monitoring session)
        if: failure()
        shell: powershell
        run: |
          foreach ($f in "build","clean_install","real_model_step") {
            $p = "ci-logs\$f.log"
            if (Test-Path $p) {
              $t = (Get-Content $p -Tail 70) -join "%0A"
              Write-Host "::error title=tail of $f.log::$t"
            }
          }
          if (Test-Path ci-logs\ci-real-model-results.json) { Write-Host "::notice title=real-model results::$((Get-Content ci-logs\ci-real-model-results.json -Raw) -replace "`r?`n",'%0A')" }
      - name: Record the build environment
        if: always()
        shell: powershell
        run: |
          if (Test-Path build_info.json) { Get-Content build_info.json }
          (Get-CimInstance Win32_OperatingSystem).Caption
      - name: Stage vetted diagnostic logs for upload (guard)
        id: stage_logs
        if: always()
        shell: powershell
        run: .\scripts\ci_stage_upload.ps1 -Kind logs -Out upload-staging\logs
      - uses: actions/upload-artifact@v4
        if: always()   # the staging folder holds only files that passed the guard, even if the guard step itself failed part-way
        with:
          name: ProjectJarvis-ci-logs
          path: upload-staging/logs
          retention-days: 14
          if-no-files-found: warn
      - name: Final gate - the run is red while any Windows unit test fails
        if: always() && (steps.unit.outcome == 'failure' || steps.gui.outcome == 'failure' || steps.perf.outcome == 'failure')
        shell: powershell
        run: |
          Write-Host "unit=${{ steps.unit.outcome }} gui=${{ steps.gui.outcome }} perf=${{ steps.perf.outcome }} (see the annotations and ci-logs)."
          exit 1
      # The installer is staged and uploaded only AFTER the final gate. The gate exits 1 when a test step failed, which makes success() false from here on.
      # unit/gui/perf are continue-on-error (their failure leaves success() true), so each outcome is also required to be 'success' explicitly.
      # Reuse mode never uploads an installer (the one it downloaded already exists in its original run).
      - name: Stage installer for upload (guard; full builds only, only after every check passed)
        id: stage_installer
        if: success() && inputs.reuse_installer_run_id == '' && steps.unit.outcome == 'success' && steps.gui.outcome == 'success' && steps.perf.outcome == 'success'
        shell: powershell
        run: .\scripts\ci_stage_upload.ps1 -Kind installer -Out upload-staging\installer
      - uses: actions/upload-artifact@v4
        if: success() && steps.stage_installer.outcome == 'success'
        with:
          name: ProjectJarvis-installer
          path: upload-staging/installer
          retention-days: 3
          if-no-files-found: error
