# Free Windows build for public repositories (GitHub-hosted runners). NOT YET RUN - a green run here is the first real evidence of a Windows build - commit it and watch the Actions tab.
name: build-windows
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      reuse_installer_run_id:
        description: "Diagnostic mode: skip build + Stage 3 steps and reuse the installer artifact of this earlier run (leave empty for a full run)"
        required: false
        default: ""
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Reuse installer from an earlier run (diagnostic mode only)
        if: inputs.reuse_installer_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ProjectJarvis-installer
          path: dist/installer
          run-id: ${{ inputs.reuse_installer_run_id }}
          github-token: ${{ github.token }}
      - name: Install Inno Setup
        if: inputs.reuse_installer_run_id == ''
        run: choco install innosetup --no-progress -y
      - name: Build (PyInstaller, then Inno Setup; the unit tests run in the next step so a Windows-only test failure cannot hide the packaging result)
        if: inputs.reuse_installer_run_id == ''
        shell: powershell
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          try { & { .\scripts\build_windows.ps1 -SkipTorch -SkipTests } *>&1 | Tee-Object -FilePath ci-logs\build.log } catch { ("TERMINATING ERROR: " + ($_ | Out-String)) | Tee-Object -FilePath ci-logs\build.log -Append; exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: unit
        name: Windows unit tests (full suite; failures are REPORTED, not hidden - this step is non-blocking only while Windows-only failures are triaged)
        if: always() && inputs.reuse_installer_run_id == '' && hashFiles('.venv/Scripts/python.exe') != ''
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $env:PYTHONUTF8 = "1"   # many tests read source files without an encoding; Windows defaults to cp1252 (test-side issue; the app code passes encodings explicitly)
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          .\.venv\Scripts\python.exe -m unittest discover -s tests *> ci-logs\unittest.log
          $code = $LASTEXITCODE
          $t = Get-Content ci-logs\unittest.log -Raw
          $blocks = $t -split "(?m)^={60,}\r?$"
          $sum = New-Object System.Collections.Generic.List[string]
          foreach ($b in $blocks) {
            $lines = ($b -split "\r?\n") | Where-Object { $_.Trim() -ne "" }
            if ($lines.Count -gt 0 -and $lines[0] -match "^(FAIL|ERROR): ") {
              $keep = @($lines | Where-Object { $_ -notmatch "^-{60,}$" -and $_ -notmatch "^Ran \d+ tests" -and $_ -notmatch "^private key written|^public key|ResourceWarning|^sys:1" })
              $last = ($keep | Select-Object -Last 4) -join " // "
              $sum.Add($lines[0].Substring(0, [Math]::Min(110, $lines[0].Length)) + "  =>  " + $last.Substring(0, [Math]::Min(420, $last.Length)))
            }
          }
          $sum.Add("RESULT exit=$code " + (($t -split "\r?\n") | Where-Object { $_ -match "^Ran \d+ tests|^(OK|FAILED)" }) -join " ; ")
          $sum | Out-File ci-logs\unittest_failures.txt -Encoding utf8
          $kinds = @("notice","warning","error"); $k = 0; $n = 0; $chunk = ""
          foreach ($l in $sum) {
            if (($chunk.Length + $l.Length) -gt 3000) { Write-Host "::$($kinds[[Math]::Min($k,2)]) title=windows unit test failures part $($n+1)::$chunk"; $chunk = ""; $n++; if ($n % 9 -eq 0) { $k++ } }
            $chunk += $l + "%0A"
          }
          Write-Host "::$($kinds[[Math]::Min($k,2)]) title=windows unit test failures part $($n+1)::$chunk"
          if ($code -ne 0) { exit $code }
      - name: Silent install / launch / uninstall check on the runner
        if: inputs.reuse_installer_run_id == ''
        shell: powershell
        run: |
          $i = (Get-ChildItem dist\installer -Filter "ProjectJarvis-Setup-*.exe" | Select-Object -First 1).FullName
          $global:LASTEXITCODE = 0
          & { .\scripts\clean_install_test.ps1 -Installer $i } *>&1 | Tee-Object -FilePath ci-logs\clean_install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real GUI launch, real setup wizard engine (real model download), real inference, firewall-blocked offline inference
        if: inputs.reuse_installer_run_id == ''
        timeout-minutes: 45
        shell: powershell
        run: |
          $i = (Get-ChildItem dist\installer -Filter "ProjectJarvis-Setup-*.exe" | Select-Object -First 1).FullName
          $global:LASTEXITCODE = 0
          & { .\scripts\ci_real_model_test.ps1 -Installer $i -LogDir ci-logs } *>&1 | Tee-Object -FilePath ci-logs\real_model_step.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Stage 4A: click-through test of the installed GUI wizard (UI Automation + real mouse clicks + real key events)"
        id: gui
        timeout-minutes: 45
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ci-logs\gui | Out-Null
          $i = (Get-ChildItem dist\installer -Filter "ProjectJarvis-Setup-*.exe" | Select-Object -First 1).FullName
          $global:LASTEXITCODE = 0
          & { .\scripts\ci_gui_wizard_test.ps1 -Installer $i -LogDir ci-logs\gui } *>&1 | Tee-Object -FilePath ci-logs\gui_step.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Stage 4B: multi-token performance measurement on the installed app (model installed by the GUI step; no second download)"
        id: perf
        if: always()
        timeout-minutes: 20
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ci-logs\perf | Out-Null
          $exe = "$env:LOCALAPPDATA\Programs\ProjectJarvis\jarvis.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error title=perf::installed jarvis.exe not found"; exit 1 }
          $global:LASTEXITCODE = 0
          & { & $exe perf --out ci-logs\perf --runs 3 --warmup 1 --max-tokens 128 } *>&1 | Tee-Object -FilePath ci-logs\perf\perf_step.log
          exit $LASTEXITCODE
      - name: Cleanup (firewall rules, uninstall keeping user data)
        if: always()
        shell: powershell
        run: |
          foreach ($r in "JarvisGuiBlock-jarvis-gui.exe","JarvisGuiBlock-jarvis.exe") { netsh advfirewall firewall delete rule name="$r" | Out-Null }
          Get-Process jarvis-gui,jarvis -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = "$env:LOCALAPPDATA\Programs\ProjectJarvis\unins000.exe"
          if (Test-Path $u) { $p = Start-Process $u -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru; $null = $p.Handle; $p.WaitForExit(); Write-Host "uninstall exit $($p.ExitCode)" }
          exit 0
      - name: Collect install-check results (runs even if an earlier step failed)
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          foreach ($f in "$env:TEMP\jarvis-clean-install-results.json","$env:TEMP\jarvis-install.log","$env:TEMP\jarvis-gui-selftest.txt") { if (Test-Path $f) { Copy-Item $f ci-logs\ } }
      - name: Report real-run results as annotations (always; the artifacts cannot be downloaded from the monitoring session)
        if: always()
        shell: powershell
        run: |
          $enc = { param($t) ($t -replace "`r?`n", "%0A") }
          foreach ($f in "ci-logs\ci-real-model-summary.txt","ci-logs\setup_state.json","ci-logs\selftest_online.json","ci-logs\setup_auto.err.txt","ci-logs\screenshot_error.txt") {
            if (Test-Path $f) { $t = (Get-Content $f -Raw); if ($t.Length -gt 6000) { $t = $t.Substring(0, 6000) + " ...[truncated]" }; Write-Host "::notice title=$f::$(& $enc $t)" }
          }
          foreach ($f in "ci-logs\gui\gui-summary.txt","ci-logs\perf\perf_summary.txt","ci-logs\perf\perf.json") {
            if (Test-Path $f) { $t = (Get-Content $f -Raw); if ($t.Length -gt 6000) { $t = $t.Substring(0, 6000) + " ...[truncated]" }; Write-Host "::notice title=$f::$(& $enc $t)" }
          }
          foreach ($s in (Get-ChildItem ci-logs\gui -Filter "*.png" -ErrorAction SilentlyContinue)) { Write-Host "::notice title=gui screenshot $($s.Name)::$($s.Length) bytes sha256=$((Get-FileHash $s.FullName -Algorithm SHA256).Hash)" }
          if (Test-Path ci-logs\gui\transcript.txt) { $t = (Get-Content ci-logs\gui\transcript.txt -Tail 40) -join "%0A"; if ($t.Length -gt 5000) { $t = $t.Substring($t.Length-5000) }; Write-Host "::notice title=gui transcript tail::$t" }
          if (Test-Path ci-logs\gui_first_launch.png) { $i = Get-Item ci-logs\gui_first_launch.png; Write-Host "::notice title=gui screenshot::gui_first_launch.png $($i.Length) bytes sha256=$((Get-FileHash $i.FullName -Algorithm SHA256).Hash)" }
          foreach ($f in (Get-ChildItem dist\installer -Filter "*.exe" -ErrorAction SilentlyContinue)) { Write-Host "::notice title=installer::$($f.Name) $($f.Length) bytes sha256=$((Get-FileHash $f.FullName -Algorithm SHA256).Hash)" }
      - name: Surface install log tail
        if: failure()
        shell: powershell
        run: |
          foreach ($f in "$env:TEMP\jarvis-install.log","ci-logs\install.log") { if (Test-Path $f) { $t = (Get-Content $f -Tail 40) -join "%0A"; Write-Host "::warning title=tail of $f::$t" } }
      - name: Surface failure details as annotations (the log download is not reachable from the monitoring session)
        if: failure()
        shell: powershell
        run: |
          foreach ($f in "build","clean_install","real_model_step") {
            $p = "ci-logs\$f.log"
            if (Test-Path $p) {
              $t = (Get-Content $p -Tail 70) -join "%0A"
              Write-Host "::error title=tail of $f.log::$t"
            }
          }
          if (Test-Path ci-logs\ci-real-model-results.json) { Write-Host "::notice title=real-model results::$((Get-Content ci-logs\ci-real-model-results.json -Raw) -replace "`r?`n",'%0A')" }
      - name: Record the build environment
        if: always()
        shell: powershell
        run: |
          if (Test-Path build_info.json) { Get-Content build_info.json }
          (Get-CimInstance Win32_OperatingSystem).Caption
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProjectJarvis-ci-logs
          path: |
            ci-logs/**
            build_info.json
            dist/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectJarvis-installer
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
      - name: Final gate - the run is red while any Windows unit test fails
        if: always() && (steps.unit.outcome == 'failure' || steps.gui.outcome == 'failure' || steps.perf.outcome == 'failure')
        shell: powershell
        run: |
          Write-Host "unit=${{ steps.unit.outcome }} gui=${{ steps.gui.outcome }} perf=${{ steps.perf.outcome }} (see the annotations and ci-logs)."
          exit 1
